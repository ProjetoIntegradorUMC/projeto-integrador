name: Criar Release

on:
  push:
    tags:
      - "v*"

# Princípio do menor privilégio: bloqueia permissões por padrão no escopo global
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # Permissão mínima restrita exclusivamente ao job de criação da release
    permissions:
      contents: write

    steps:
      - name: Checkout
        # Fixado por SHA completo para proteção contra Supply Chain Attack (Issue #92)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Criar ZIP
        run: |
          mkdir "projeto-${GITHUB_REF_NAME}"

          git archive \
            --format=zip \
            --output="projeto-${GITHUB_REF_NAME}.zip" \
            HEAD

      - name: Criar Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "projeto-${GITHUB_REF_NAME}.zip" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

name: Pipeline DevSecOps Fundamental

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Principio do Menor Privilegio: revoga todas as permissoes padrao do GITHUB_TOKEN no escopo global.
permissions: {}

jobs:
  secrets-scan:
    name: Varredura de Segredos (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # fetch-depth: 0 faz o clone completo do historico Git para permitir que o TruffleHog
      # inspecione todos os commits do push ou do diff do Pull Request sem perder referencias.
      - name: Checkout do repositório com histórico completo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Escopo da varredura: analisa os commits introduzidos no push ou no diff do Pull Request
      # em busca de credenciais vazadas (chaves Fernet, SECRET_KEY, TOTP_ENCRYPTION_KEY, senhas de banco e tokens).
      # Razao da flag --only-verified: filtra apenas segredos validados ativamente ou de alta confianca,
      # eliminando falsos positivos em strings de teste ou hashes simulados. A action oficial ja injeta
      # nativamente a flag --fail na execucao do container, bloqueando o merge (exit code 183) se encontrar segredos.
      - name: Executar varredura de segredos com TruffleHog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --only-verified

  sca-trivy:
    name: Análise de Dependências SCA (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TRIVY_VERSION: 0.69.3
      TRIVY_SHA256: 1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # O setup padrao do Trivy depende de get.trivy.dev, que apresentou instabilidade (aquasecurity/setup-trivy#42).
      # Para garantir disponibilidade e seguranca na cadeia de suprimentos, o binario oficial e baixado
      # diretamente do GitHub Releases com verificacao estrita de checksum SHA-256.
      - name: Instalar Trivy com verificação SHA-256
        run: |
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          tar -xzf trivy.tar.gz -C "${RUNNER_TEMP}/trivy-bin" trivy
          rm trivy.tar.gz
          echo "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/trivy-bin/trivy" --version

      # Executa Software Composition Analysis (SCA) em modo filesystem (fs) a partir da raiz do repositorio,
      # cobrindo o requirements.txt e demais manifestos. Bloqueia o pipeline (exit-code: '1') caso existam
      # CVEs de severidade HIGH ou CRITICAL que ja possuam correcao publicada (ignore-unfixed: true).
      - name: Executar varredura SCA com Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-sca-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: .venv,node_modules

      - name: Exibir resumo de vulnerabilidades SCA no log
        if: always()
        run: |
          jq -r '.Results[]? | select(.Vulnerabilities != null) | .Vulnerabilities[] | "\(.Severity) | \(.PkgName) (\(.InstalledVersion) -> \(.FixedVersion)) | \(.VulnerabilityID): \(.Title)"' trivy-sca-report.json || true

      # Publica o relatorio de auditoria como artefato da execucao mesmo quando o scan encontra CVEs e falha o step anterior.
      - name: Publicar relatório SCA do Trivy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-sca-report
          path: trivy-sca-report.json
          if-no-files-found: error

  sast:
    name: SAST com Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SEMGREP_VERSION: 1.183.0

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # A semgrep-action foi arquivada em 2024, então o Semgrep é instalado pelo pip em ambiente isolado e com a versão fixa.
      - name: Instalar Semgrep
        run: |
          python3 -m venv "${RUNNER_TEMP}/semgrep-venv"
          "${RUNNER_TEMP}/semgrep-venv/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}"
          echo "${RUNNER_TEMP}/semgrep-venv/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/semgrep-venv/bin/semgrep" --version

      # Só pra ver tudo no log (ERROR, WARNING e INFO), não bloqueia o build.
      - name: Listar achados de todas as severidades
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/python \
            --config p/flask \
            --config p/javascript \
            --exclude tests/ \
            --metrics off \
            backend/app frontend/js

      # Rulesets: p/python e p/flask pro backend, p/javascript pro frontend.
      # Só achado ERROR derruba o job (--severity ERROR + --error), o resto nem aparece.
      # Tests ficam fora (--exclude tests/) porque os fixtures dão falso positivo.
      # --metrics off pra não mandar métrica de uso pro Semgrep.
      - name: Executar SAST com Semgrep
        run: |
          semgrep scan \
            --config p/python \
            --config p/flask \
            --config p/javascript \
            --severity ERROR \
            --error \
            --exclude tests/ \
            --metrics off \
            backend/app frontend/js
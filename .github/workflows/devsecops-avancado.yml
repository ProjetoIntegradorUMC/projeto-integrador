name: DevSecOps Avançado

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  dast-zap:
    name: Varredura DAST com OWASP ZAP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mentory
          POSTGRES_USER: mentory_admin
          POSTGRES_PASSWORD: mentory_admin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mentory_admin -d mentory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Construir imagem da aplicação
        run: docker build --tag mentory-dast:ci .

      - name: Iniciar aplicação para o DAST
        run: |
          docker run --detach \
            --name mentory-dast \
            --network host \
            --env DB_HOST=127.0.0.1 \
            --env DB_PORT=5432 \
            --env DB_NAME=mentory \
            --env DB_ADMIN_USER=mentory_admin \
            --env DB_ADMIN_PASSWORD=mentory_admin_ci \
            --env DB_APP_USER=mentory_app \
            --env DB_APP_PASSWORD=mentory_app_ci \
            --env DB_APP_ROLE=mentory_app_role \
            --env SECRET_KEY=dast-ci-secret-key \
            --env TOTP_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --env FLASK_DEBUG=false \
            --env SECURE_COOKIES=false \
            mentory-dast:ci

      - name: Aguardar aplicação ficar saudável
        run: |
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused \
            http://127.0.0.1:5000/

      - name: Executar varredura completa do OWASP ZAP
        id: zap-scan
        continue-on-error: true
        run: |
          set +e
          # A imagem do ZAP executa como usuário não-root e precisa escrever no volume.
          touch zap-report.html zap-report.json zap-report.md
          chmod a+rw zap-report.html zap-report.json zap-report.md
          docker run --rm \
            --network host \
            --volume "${GITHUB_WORKSPACE}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://127.0.0.1:5000 \
            -J zap-report.json \
            -w zap-report.md \
            -r zap-report.html \
            -c .zap/rules.tsv \
            -a
          status=$?
          echo "exit-code=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Publicar relatório do ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: |
            zap-report.html
            zap-report.json
            zap-report.md
          if-no-files-found: error

      - name: Bloquear pipeline quando o ZAP encontrar alertas
        if: steps.zap-scan.outputs.exit-code != '0'
        run: |
          echo "O OWASP ZAP encontrou alertas ou falhou (exit code ${{ steps.zap-scan.outputs.exit-code }})." >&2
          exit 1

      - name: Exibir logs e remover container da aplicação
        if: always()
        run: |
          docker logs mentory-dast || true
          docker rm --force mentory-dast || true

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Integrador - Autenticação</title>

    <!-- Bootstrap via CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-sm auth-card">
            <div class="card-body p-4">

                <!-- LOGIN -->
                <section id="loginSection">
                    <h1 class="text-center mb-4">Login</h1>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">
                                E-mail
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="loginEmail"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">
                                Senha
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="loginPassword"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Entrar
                        </button>
                    </form>

                    <div id="loginMessage" class="mt-3"></div>

                    <div class="text-center mt-3">
                        <button
                            type="button"
                            class="btn btn-link"
                            id="showRegister"
                        >
                            Criar uma conta
                        </button>
                    </div>
                </section>

                <!-- CADASTRO -->
                <section id="registerSection" class="d-none">
                    <h1 class="text-center mb-4">Cadastro</h1>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="registerUsername" class="form-label">
                                Usuário
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="registerUsername"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="registerEmail" class="form-label">
                                E-mail
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="registerEmail"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="registerPassword" class="form-label">
                                Senha
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="registerPassword"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Cadastrar
                        </button>
                    </form>

                    <div id="registerMessage" class="mt-3"></div>

                    <div class="text-center mt-3">
                        <button
                            type="button"
                            class="btn btn-link"
                            id="showLogin"
                        >
                            Já tenho uma conta
                        </button>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
